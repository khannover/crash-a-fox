<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crash Fuchs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #87CEEB; touch-action: none; }
        #game-canvas { display: block; width: 100vw; height: 100vh; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .interactive { pointer-events: auto; }
    </style>
</head>
<body>

    <!-- Spiel-Canvas -->
    <div id="game-container"></div>

    <!-- UI Overlay -->
    <div id="ui" class="ui-layer flex flex-col justify-between p-6">
        <div class="flex justify-between items-start text-white drop-shadow-md font-bold text-2xl md:text-4xl" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">
            <div>Punkte: <span id="score">0</span></div>
        </div>

        <!-- Music Visualizer HUD -->
        <div id="music-viz" class="hidden fixed top-6 right-6 flex gap-1 items-end h-10"></div>

        <!-- Startbildschirm -->
        <div id="start-screen" class="interactive absolute inset-0 flex flex-col items-center justify-center bg-black/50 backdrop-blur-sm z-10">
            <h1 class="text-5xl md:text-7xl font-extrabold text-yellow-400 mb-4 text-center drop-shadow-lg" style="-webkit-text-stroke: 2px #b45309;">CRASH FUCHS</h1>
            <p class="text-white text-lg md:text-2xl mb-8 text-center px-4 max-w-2xl">
                Steuerung:<br>
                ⬅️ ➡️ (Pfeiltasten oder A/D) zum Wechseln der Spur<br>
                ⬆️ (Pfeil hoch, Leertaste oder W) zum Springen<br>
                📱 Mobile: Wischen (Swipe) nach links/rechts/oben
            </p>
            <button id="start-btn" class="px-8 py-4 bg-orange-500 hover:bg-orange-600 text-white text-2xl font-bold rounded-xl shadow-lg transition transform hover:scale-105 border-4 border-yellow-300">
                Spiel Starten
            </button>
            <button id="music-mode-btn" class="mt-4 px-8 py-4 bg-orange-500 hover:bg-orange-600 text-white text-2xl font-bold rounded-xl shadow-lg transition transform hover:scale-105 border-4 border-yellow-300">
                🎵 Music Mode
            </button>
            <div id="music-panel" class="hidden mt-4 p-4 bg-gray-800/90 rounded-xl text-white w-full max-w-md">
                <!-- Difficulty selector -->
                <div class="mb-4">
                    <label class="block mb-2 font-semibold">Schwierigkeit</label>
                    <div class="flex gap-2">
                        <button class="diff-btn flex-1 py-2 rounded-lg font-bold text-sm transition border-2" data-diff="easy">🐢 Leicht</button>
                        <button class="diff-btn flex-1 py-2 rounded-lg font-bold text-sm transition border-2" data-diff="normal">🦊 Normal</button>
                        <button class="diff-btn flex-1 py-2 rounded-lg font-bold text-sm transition border-2" data-diff="hard">🔥 Schwer</button>
                    </div>
                </div>
                <label for="audio-file" class="block mb-2 font-semibold">Upload MP3</label>
                <input id="audio-file" type="file" accept="audio/mp3,audio/mpeg,audio/*" class="block w-full mb-1 text-sm text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-orange-500 file:text-white hover:file:bg-orange-600">
                <p id="last-file-hint" class="hidden text-xs text-gray-400 mb-3"></p>
                <label for="audio-url" class="block mb-2 font-semibold">or paste audio URL</label>
                <input id="audio-url" type="text" placeholder="https://..." class="block w-full mb-4 px-3 py-2 rounded-lg bg-gray-700 text-white placeholder-gray-400 text-sm">
                <button id="play-music-btn" disabled class="w-full px-8 py-3 bg-green-600 hover:bg-green-700 disabled:opacity-50 disabled:cursor-not-allowed text-white text-xl font-bold rounded-xl shadow-lg transition">
                    ▶ Play with Music
                </button>
            </div>
        </div>

        <!-- Game Over Bildschirm -->
        <div id="game-over-screen" class="interactive absolute inset-0 flex flex-col items-center justify-center bg-black/80 z-20 hidden overflow-y-auto py-6">
            <h2 class="text-5xl md:text-7xl font-bold text-red-500 mb-2">AUA!</h2>
            <p class="text-white text-2xl mb-4">Deine Punkte: <span id="final-score" class="text-yellow-400 font-bold">0</span></p>

            <!-- Highscore speichern -->
            <div id="save-score-form" class="flex gap-2 mb-4 w-full max-w-xs">
                <input id="player-name" type="text" maxlength="20" placeholder="Dein Name…"
                    class="flex-1 px-3 py-2 rounded-lg bg-gray-700 text-white placeholder-gray-400 text-base border border-gray-500 focus:outline-none focus:border-yellow-400">
                <button id="save-score-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition" title="Score speichern">
                    💾
                </button>
            </div>

            <!-- Highscore-Liste -->
            <div id="highscore-list" class="hidden mb-4 w-full max-w-xs">
                <h3 class="text-center text-yellow-400 font-bold mb-2">🏆 Top Scores</h3>
                <div id="highscore-entries" class="text-white text-sm"></div>
            </div>

            <div class="flex gap-4 mt-2">
                <button id="restart-btn" class="px-6 py-4 bg-yellow-500 hover:bg-yellow-600 text-black text-xl font-bold rounded-xl shadow-lg transition transform hover:scale-105">
                    🔄 Nochmal
                </button>
                <button id="main-menu-btn" class="px-6 py-4 bg-gray-600 hover:bg-gray-500 text-white text-xl font-bold rounded-xl shadow-lg transition transform hover:scale-105">
                    🏠 Menü
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- Variablen & Zustand ---
        let scene, camera, renderer;
        let foxGroup, foxBody, foxLegs = [];
        let obstacles = [];
        let collectibles = [];
        let groundSegments = [];
        let animationId;
        let ambientLight;
        
        // Spielstatus
        let isPlaying = false;
        let score = 0;
        let speed = 0.3; // Initiale Geschwindigkeit (Kisten kommen auf uns zu)
        let distance = 0;
        
        // Fuchs Bewegung
        const LANE_WIDTH = 3;
        let currentLane = 0; // -1 (links), 0 (mitte), 1 (rechts)
        let isJumping = false;
        let velocityY = 0;
        const GRAVITY = -0.015;
        const JUMP_STRENGTH = 0.35;
        const FLOOR_Y = 0.5; // Y-Position des Fuchses am Boden
        let runTime = 0; // Für die Laufanimation

        // --- Audio / Music Reactive Mode ---
        let audioContext = null;
        let analyser = null;
        let audioSource = null;
        let audioBuffer = null;
        let musicReactiveMode = false;
        let lastGameWasMusic = false;    // tracks whether last game used music mode
        let musicPanelRestored = false;  // restore saved audio only once per session

        // Band energy values updated each frame
        let bassEnergy = 0;   // 20–250 Hz
        let midEnergy = 0;    // 250–2000 Hz
        let trebleEnergy = 0; // 2000–8000 Hz
        let overallAmplitude = 0;
        let beatCooldown = 0;
        let dataArray = null;

        // Difficulty
        let musicDifficulty = 'normal';
        const DIFFICULTY_SETTINGS = {
            'easy':   { bassSpeedMultiplier: 0.0015, maxSpeed: 0.7 },
            'normal': { bassSpeedMultiplier: 0.003,  maxSpeed: 1.2 },
            'hard':   { bassSpeedMultiplier: 0.006,  maxSpeed: 2.0 }
        };

        // Audio tuning constants
        const BASS_BIN_START = 0;
        const BASS_BIN_END = 4;       // bins 0–3 (bass)
        const MID_BIN_START = 4;
        const MID_BIN_END = 16;       // bins 4–15 (mid)
        const TREBLE_BIN_START = 16;
        const TREBLE_BIN_END = 32;    // bins 16–31 (treble)
        const BASS_BEAT_THRESHOLD = 0.75;
        const BEAT_COOLDOWN_FRAMES = 15;
        const BASE_SPEED_INCREMENT = 0.0001;
        const MIN_MUSIC_SPEED = 0.3;
        const BASS_SPEED_MULTIPLIER = 0.008;
        const SHAKE_INTENSITY_X = 0.3;
        const SHAKE_INTENSITY_Y = 0.15;

        // --- Initialisierung ---
        function init() {
            const container = document.getElementById('game-container');

            // Szene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Himmelblau
            scene.fog = new THREE.Fog(0x87CEEB, 20, 100); // Nebel für Tiefeneffekt

            // Kamera (Hinter dem Fuchs platziert)
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
            camera.position.set(0, 5, 8);
            camera.lookAt(0, 1, -10);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Licht
            ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.camera.top = 20;
            dirLight.shadow.camera.bottom = -20;
            dirLight.shadow.camera.left = -20;
            dirLight.shadow.camera.right = 20;
            scene.add(dirLight);

            // Welt aufbauen
            createGround();
            createFox();

            // Event Listeners für Resize
            window.addEventListener('resize', onWindowResize);

            // Event Listeners für UI
            document.getElementById('start-btn').addEventListener('click', startGame);
            document.getElementById('restart-btn').addEventListener('click', () => {
                if (lastGameWasMusic && audioBuffer) {
                    setupAudioContext();
                    startGame();
                    startMusic();
                    document.getElementById('music-viz').classList.remove('hidden');
                } else {
                    startGame();
                }
            });
            document.getElementById('main-menu-btn').addEventListener('click', mainMenu);

            // Save highscore button
            document.getElementById('save-score-btn').addEventListener('click', () => {
                const nameInput = document.getElementById('player-name');
                const name = nameInput.value.trim() || 'Anonym';
                localStorage.setItem('crashfuchs_lastPlayerName', name);
                saveHighscore(name, score);
                document.getElementById('save-score-form').classList.add('hidden');
                loadHighscores();
            });

            // Music Mode UI
            document.getElementById('music-mode-btn').addEventListener('click', () => {
                const panel = document.getElementById('music-panel');
                panel.classList.toggle('hidden');
                if (!panel.classList.contains('hidden') && !musicPanelRestored) {
                    musicPanelRestored = true;
                    restoreLastAudio();
                }
            });

            // Difficulty buttons
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.addEventListener('click', () => setDifficulty(btn.dataset.diff));
            });
            // Apply saved (or default) difficulty on load
            setDifficulty(localStorage.getItem('crashfuchs_difficulty') || 'normal');

            document.getElementById('audio-file').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    loadAudioFile(file);
                    // Persist file in IndexedDB so it can be restored next session
                    const reader2 = new FileReader();
                    reader2.onload = ev => saveAudioToIDB(ev.target.result, file.name);
                    reader2.readAsArrayBuffer(file);
                    // Clear any saved URL so we don't conflict
                    localStorage.removeItem('crashfuchs_lastAudioUrl');
                }
            });

            document.getElementById('audio-url').addEventListener('change', (e) => {
                const url = e.target.value.trim();
                if (url) {
                    loadAudioURL(url);
                    localStorage.setItem('crashfuchs_lastAudioUrl', url);
                    // Clear saved file so URL takes precedence next session
                    clearAudioFromIDB();
                }
            });

            document.getElementById('play-music-btn').addEventListener('click', () => {
                setupAudioContext();
                startGame();
                startMusic();
                document.getElementById('music-viz').classList.remove('hidden');
            });

            // Create music viz bars
            const vizContainer = document.getElementById('music-viz');
            for (let i = 0; i < 8; i++) {
                const bar = document.createElement('div');
                bar.className = 'viz-bar';
                bar.style.cssText = 'width:6px;background:#FBBF24;border-radius:2px;height:4px;';
                vizContainer.appendChild(bar);
            }

            // Steuerung einrichten
            setupControls();

            // Erster Render-Durchlauf (damit man was im Hintergrund sieht)
            renderer.render(scene, camera);
        }

        // --- Welt & Objekte ---
        function createGround() {
            // Eine einfache Straße mit Gras an den Seiten
            const grassMat = new THREE.MeshLambertMaterial({ color: 0x4CAF50 });
            const roadMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 }); // Braun/Erdig wie in Crash
            
            // Langer Boden
            const groundGeo = new THREE.PlaneGeometry(50, 200);
            const ground = new THREE.Mesh(groundGeo, grassMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.z = -50;
            ground.receiveShadow = true;
            scene.add(ground);

            // Straße
            const roadGeo = new THREE.PlaneGeometry(9, 200);
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.y = 0.01; // Leicht über dem Gras
            road.position.z = -50;
            road.receiveShadow = true;
            scene.add(road);

            // Bewegliche Streifen auf der Straße für Geschwindigkeitsgefühl
            for(let i=0; i<10; i++) {
                const stripeGeo = new THREE.PlaneGeometry(0.5, 4);
                const stripeMat = new THREE.MeshBasicMaterial({ color: 0xdeb887 });
                const stripe = new THREE.Mesh(stripeGeo, stripeMat);
                stripe.rotation.x = -Math.PI / 2;
                stripe.position.set(0, 0.02, -i * 10);
                scene.add(stripe);
                groundSegments.push(stripe);
            }
        }

        function createFox() {
            foxGroup = new THREE.Group();

            const foxColor = 0xFFCC00; // Gelber Fuchs
            const mat = new THREE.MeshLambertMaterial({ color: foxColor });
            const darkMat = new THREE.MeshLambertMaterial({ color: 0x333333 }); // Nase/Augen

            // Körper
            const bodyGeo = new THREE.BoxGeometry(1.2, 1, 2);
            foxBody = new THREE.Mesh(bodyGeo, mat);
            foxBody.position.y = 0.5;
            foxBody.castShadow = true;
            foxGroup.add(foxBody);

            // Kopf
            const headGeo = new THREE.BoxGeometry(1, 1, 1.2);
            const head = new THREE.Mesh(headGeo, mat);
            head.position.set(0, 1.2, -0.8);
            head.castShadow = true;
            foxGroup.add(head);

            // Schnauze
            const snoutGeo = new THREE.BoxGeometry(0.6, 0.4, 0.8);
            const snout = new THREE.Mesh(snoutGeo, mat);
            snout.position.set(0, 0.9, -1.6);
            foxGroup.add(snout);

            // Nase
            const noseGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
            const nose = new THREE.Mesh(noseGeo, darkMat);
            nose.position.set(0, 1.0, -2.0);
            foxGroup.add(nose);

            // Ohren
            const earGeo = new THREE.ConeGeometry(0.3, 0.6, 4);
            const earL = new THREE.Mesh(earGeo, mat);
            earL.position.set(-0.4, 1.8, -0.5);
            foxGroup.add(earL);
            const earR = new THREE.Mesh(earGeo, mat);
            earR.position.set(0.4, 1.8, -0.5);
            foxGroup.add(earR);

            // Gelbe Blume auf dem Kopf!
            const flowerGroup = new THREE.Group();
            
            // Stiel
            const stemGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.6);
            const stemMat = new THREE.MeshLambertMaterial({ color: 0x228B22 });
            const stem = new THREE.Mesh(stemGeo, stemMat);
            stem.position.y = 0.3;
            flowerGroup.add(stem);

            // Mitte der Blume
            const centerGeo = new THREE.SphereGeometry(0.15);
            const centerMat = new THREE.MeshLambertMaterial({ color: 0xFF8C00 }); // Orange Mitte
            const center = new THREE.Mesh(centerGeo, centerMat);
            center.position.y = 0.6;
            flowerGroup.add(center);

            // Blütenblätter (Gelb)
            const petalMat = new THREE.MeshLambertMaterial({ color: 0xFFFF00 });
            for(let i=0; i<5; i++) {
                const petalGeo = new THREE.SphereGeometry(0.12);
                const petal = new THREE.Mesh(petalGeo, petalMat);
                const angle = (i / 5) * Math.PI * 2;
                petal.position.set(Math.cos(angle)*0.2, 0.6, Math.sin(angle)*0.2);
                flowerGroup.add(petal);
            }

            flowerGroup.position.set(0, 1.7, -0.8);
            // Blume leicht rotieren lassen im Render-Loop (siehe animate)
            flowerGroup.name = "flower";
            foxGroup.add(flowerGroup);

            // Beine
            for(let i=0; i<4; i++) {
                const legGeo = new THREE.BoxGeometry(0.3, 0.8, 0.3);
                const leg = new THREE.Mesh(legGeo, mat);
                const isFront = i < 2;
                const isLeft = i % 2 === 0;
                leg.position.set(isLeft ? -0.5 : 0.5, 0.4, isFront ? -0.5 : 0.5);
                leg.castShadow = true;
                foxGroup.add(leg);
                foxLegs.push(leg);
            }

            foxGroup.position.set(0, FLOOR_Y, 0);
            scene.add(foxGroup);
        }

        function createObstacle(zPos, lane) {
            // Typische "Crash" Holzkiste
            const boxGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            // Einfaches Kreuz-Muster andeuten durch Farbe
            const boxMat = new THREE.MeshLambertMaterial({ color: 0xcd853f }); 
            const box = new THREE.Mesh(boxGeo, boxMat);
            
            box.position.set(lane * LANE_WIDTH, 0.75, zPos);
            box.castShadow = true;
            box.receiveShadow = true;
            
            // Inneres Kreuz (simuliert Kisten-Textur)
            const borderGeo = new THREE.BoxGeometry(1.6, 0.2, 1.6);
            const borderMat = new THREE.MeshLambertMaterial({ color: 0x8b4513 });
            const borderTop = new THREE.Mesh(borderGeo, borderMat);
            const borderBottom = new THREE.Mesh(borderGeo, borderMat);
            borderTop.position.y = 0.65;
            borderBottom.position.y = -0.65;
            box.add(borderTop);
            box.add(borderBottom);

            scene.add(box);
            obstacles.push(box);
        }

        function createCollectible(zPos, lane) {
            // Wumpa-Frucht ähnlich (Roter Apfel)
            const fruitGeo = new THREE.SphereGeometry(0.5, 16, 16);
            const fruitMat = new THREE.MeshLambertMaterial({ color: 0xff0000 });
            const fruit = new THREE.Mesh(fruitGeo, fruitMat);
            
            fruit.position.set(lane * LANE_WIDTH, 1.5, zPos);
            fruit.castShadow = true;
            
            // Kleines Blatt
            const leafGeo = new THREE.CylinderGeometry(0, 0.2, 0.4);
            const leafMat = new THREE.MeshLambertMaterial({ color: 0x00ff00 });
            const leaf = new THREE.Mesh(leafGeo, leafMat);
            leaf.position.y = 0.5;
            leaf.rotation.z = 0.5;
            fruit.add(leaf);

            scene.add(fruit);
            collectibles.push({ mesh: fruit, type: 'apple' });
        }

        // --- Steuerung ---
        function setupControls() {
            // Tastatur
            window.addEventListener('keydown', (e) => {
                if (!isPlaying) return;
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                    if (currentLane > -1) currentLane--;
                } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                    if (currentLane < 1) currentLane++;
                } else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.code === 'Space') {
                    jump();
                }
            });

            // Touch / Wischen (Swipe)
            let touchStartX = 0;
            let touchStartY = 0;

            window.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            });

            window.addEventListener('touchend', (e) => {
                if (!isPlaying) return;
                const touchEndX = e.changedTouches[0].screenX;
                const touchEndY = e.changedTouches[0].screenY;
                
                const dx = touchEndX - touchStartX;
                const dy = touchEndY - touchStartY;

                if (Math.abs(dx) > Math.abs(dy)) {
                    // Horizontal Swipe
                    if (Math.abs(dx) > 30) {
                        if (dx > 0 && currentLane < 1) currentLane++; // Swipe Right
                        else if (dx < 0 && currentLane > -1) currentLane--; // Swipe Left
                    }
                } else {
                    // Vertical Swipe
                    if (dy < -30) jump(); // Swipe Up
                }
            });
        }

        function jump() {
            if (!isJumping) {
                isJumping = true;
                velocityY = JUMP_STRENGTH;
            }
        }

        // --- Audio Functions ---
        function setupAudioContext() {
            if (audioContext) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            analyser.connect(audioContext.destination);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
        }

        function loadAudioFile(file) {
            setupAudioContext();
            const reader = new FileReader();
            reader.onload = function(e) {
                audioContext.decodeAudioData(
                    e.target.result,
                    function(buffer) {
                        audioBuffer = buffer;
                        document.getElementById('play-music-btn').disabled = false;
                    },
                    function() {
                        alert('Could not decode audio file. Please try a different MP3.');
                    }
                );
            };
            reader.readAsArrayBuffer(file);
        }

        function loadAudioURL(url) {
            setupAudioContext();
            fetch(url)
                .then(r => {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.arrayBuffer();
                })
                .then(buf => audioContext.decodeAudioData(
                    buf,
                    buffer => {
                        audioBuffer = buffer;
                        document.getElementById('play-music-btn').disabled = false;
                    },
                    () => {
                        alert('Could not decode audio from URL. The file may not be a supported audio format.');
                    }
                ))
                .catch(err => {
                    if (err.message && err.message.startsWith('HTTP ')) {
                        alert('Could not load audio from URL (' + err.message + '). Check the URL and ensure the server allows cross-origin requests.');
                    }
                    // decode errors are already handled above
                });
        }

        function startMusic() {
            if (audioSource) {
                try { audioSource.stop(); } catch(e) {}
                audioSource = null;
            }
            if (!audioBuffer) return;
            audioSource = audioContext.createBufferSource();
            audioSource.buffer = audioBuffer;
            audioSource.loop = true;
            audioSource.connect(analyser);
            audioSource.start(0);
            musicReactiveMode = true;
        }

        function updateAudioData() {
            if (!analyser || !dataArray) return;
            analyser.getByteFrequencyData(dataArray);

            // Bass: bins 0–3
            let bass = 0;
            for (let i = BASS_BIN_START; i < BASS_BIN_END; i++) bass += dataArray[i];
            bassEnergy = (bass / (BASS_BIN_END - BASS_BIN_START)) / 255;

            // Mid: bins 4–15
            let mid = 0;
            for (let i = MID_BIN_START; i < MID_BIN_END; i++) mid += dataArray[i];
            midEnergy = (mid / (MID_BIN_END - MID_BIN_START)) / 255;

            // Treble: bins 16–31
            let treble = 0;
            for (let i = TREBLE_BIN_START; i < TREBLE_BIN_END; i++) treble += dataArray[i];
            trebleEnergy = (treble / (TREBLE_BIN_END - TREBLE_BIN_START)) / 255;

            overallAmplitude = (bassEnergy + midEnergy + trebleEnergy) / 3;
        }

        function updateMusicViz() {
            const bars = document.querySelectorAll('#music-viz .viz-bar');
            const step = Math.floor(dataArray.length / 8);
            bars.forEach((bar, i) => {
                const idx = Math.min(i * step, dataArray.length - 1);
                const value = dataArray[idx] / 255;
                bar.style.height = Math.max(4, value * 40) + 'px';
            });
        }

        // --- Game Logic & Loop ---
        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            
            // Stop audio from previous session
            if (audioSource) {
                try { audioSource.stop(); } catch(e) {}
                audioSource = null;
            }
            musicReactiveMode = false;
            document.getElementById('music-viz').classList.add('hidden');

            // Reset state
            score = 0;
            distance = 0;
            speed = 0.3;
            currentLane = 0;
            foxGroup.position.set(0, FLOOR_Y, 0);
            foxGroup.rotation.y = 0;
            isJumping = false;
            velocityY = 0;
            beatCooldown = 0;
            camera.position.set(0, 5, 8);
            updateScoreDisplay();
            
            // Clean up old objects
            obstacles.forEach(o => scene.remove(o));
            collectibles.forEach(c => scene.remove(c.mesh));
            obstacles = [];
            collectibles = [];

            // Generate initial level ahead
            for(let i=1; i<=10; i++) spawnRandomRow(-i * 20);

            isPlaying = true;
            if(!animationId) animate();
        }

        function spawnRandomRow(zPos) {
            const rowType = Math.random();
            const lane = Math.floor(Math.random() * 3) - 1; // -1, 0, or 1

            if (rowType < 0.6) {
                // Nur Kiste
                createObstacle(zPos, lane);
            } else if (rowType < 0.8) {
                // Kiste und Apfel auf einer anderen Spur
                createObstacle(zPos, lane);
                let appleLane = lane === 0 ? (Math.random() > 0.5 ? 1 : -1) : 0;
                createCollectible(zPos, appleLane);
            } else {
                // Nur Apfel (einfacher Punkt)
                createCollectible(zPos, lane);
            }
        }

        function gameOver() {
            isPlaying = false;
            lastGameWasMusic = musicReactiveMode;
            // Stop music playback
            if (audioSource) {
                try { audioSource.stop(); } catch(e) {}
                audioSource = null;
            }
            musicReactiveMode = false;
            document.getElementById('music-viz').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = Math.floor(score);
            // Pre-fill name from last session
            const savedName = localStorage.getItem('crashfuchs_lastPlayerName') || '';
            document.getElementById('player-name').value = savedName;
            document.getElementById('save-score-form').classList.remove('hidden');
            loadHighscores();
        }

        function mainMenu() {
            isPlaying = false;
            if (audioSource) {
                try { audioSource.stop(); } catch(e) {}
                audioSource = null;
            }
            musicReactiveMode = false;
            document.getElementById('music-viz').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }

        function updateScoreDisplay() {
            document.getElementById('score').innerText = Math.floor(score);
        }

        function animate() {
            animationId = requestAnimationFrame(animate);

            if (isPlaying) {
                // Weltgeschwindigkeit erhöhen
                if (musicReactiveMode) {
                    updateAudioData();
                    const diff = DIFFICULTY_SETTINGS[musicDifficulty];
                    // Base speed progression + bass boost; capped per difficulty
                    speed = Math.min(diff.maxSpeed,
                        Math.max(MIN_MUSIC_SPEED, speed + BASE_SPEED_INCREMENT + bassEnergy * diff.bassSpeedMultiplier));
                } else {
                    speed += BASE_SPEED_INCREMENT;
                }
                distance += speed;
                score += speed * 0.1;
                
                // UI ab und zu updaten
                if(Math.floor(distance) % 5 === 0) updateScoreDisplay();

                // Fuchs Horizontal-Bewegung (Lerp)
                const targetX = currentLane * LANE_WIDTH;
                foxGroup.position.x += (targetX - foxGroup.position.x) * 0.15;

                // Fuchs Rotation beim Spurwechsel (kleiner Neigeeffekt)
                foxGroup.rotation.z = (foxGroup.position.x - targetX) * 0.1;

                // Sprung-Logik (Gravitation)
                if (isJumping) {
                    foxGroup.position.y += velocityY;
                    velocityY += GRAVITY;
                    
                    if (foxGroup.position.y <= FLOOR_Y) {
                        foxGroup.position.y = FLOOR_Y;
                        isJumping = false;
                        velocityY = 0;
                    }
                }

                // Lauf-Animation (Beine wackeln, Körper wippt)
                runTime += speed * 2;
                if(!isJumping) {
                    foxBody.position.y = 0.5 + Math.abs(Math.sin(runTime * 2)) * 0.1;
                    foxLegs[0].rotation.x = Math.sin(runTime * 2) * 0.5;
                    foxLegs[1].rotation.x = -Math.sin(runTime * 2) * 0.5;
                    foxLegs[2].rotation.x = -Math.sin(runTime * 2) * 0.5;
                    foxLegs[3].rotation.x = Math.sin(runTime * 2) * 0.5;
                } else {
                    // Pose während des Sprungs
                    foxLegs.forEach(leg => leg.rotation.x = 0.2);
                }

                // Blume drehen
                const flower = foxGroup.getObjectByName("flower");
                if(flower) flower.rotation.y += 0.05 + (musicReactiveMode ? trebleEnergy * 0.5 : 0);

                // Music reactive effects
                if (musicReactiveMode) {
                    // Background / fog color shift
                    const targetColor = new THREE.Color().setHSL(
                        0.55 - overallAmplitude * 0.35,
                        0.5 + midEnergy * 0.5,
                        0.6 + trebleEnergy * 0.1
                    );
                    scene.background.lerp(targetColor, 0.05);
                    scene.fog.color.lerp(targetColor, 0.05);

                    // Ambient light pulse
                    ambientLight.intensity = 0.6 + bassEnergy * 0.6;

                    // Camera shake on heavy bass beats
                    if (bassEnergy > BASS_BEAT_THRESHOLD && beatCooldown === 0) {
                        camera.position.x += (Math.random() - 0.5) * SHAKE_INTENSITY_X;
                        camera.position.y += (Math.random() - 0.5) * SHAKE_INTENSITY_Y;
                        beatCooldown = BEAT_COOLDOWN_FRAMES;
                    }
                    if (beatCooldown > 0) beatCooldown--;
                    // Gradually return camera to base position to prevent drift
                    camera.position.x += (0 - camera.position.x) * 0.1;
                    camera.position.y += (5 - camera.position.y) * 0.1;

                    // Update visualizer bars
                    updateMusicViz();
                }

                // Bodenstreifen bewegen
                groundSegments.forEach(stripe => {
                    stripe.position.z += speed;
                    if (stripe.position.z > 10) stripe.position.z -= 100;
                });

                // Hindernisse bewegen & Kollision prüfen
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.position.z += speed;

                    // Kollisionsabfrage (AABB stark vereinfacht)
                    const distX = Math.abs(foxGroup.position.x - obs.position.x);
                    const distZ = Math.abs(foxGroup.position.z - obs.position.z);
                    const distY = obs.position.y - foxGroup.position.y; // Kisten sind ca 1.5 hoch
                    
                    if (distZ < 1.0 && distX < 1.0 && distY > -0.5) {
                        // Crash!
                        gameOver();
                    }

                    // Entfernen und neu spawnen wenn hinter Kamera
                    if (obs.position.z > 10) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                        spawnRandomRow(-100);
                    }
                }

                // Collectibles bewegen & einsammeln
                for (let i = collectibles.length - 1; i >= 0; i--) {
                    let col = collectibles[i];
                    col.mesh.position.z += speed;
                    col.mesh.rotation.y += 0.05;

                    const distX = Math.abs(foxGroup.position.x - col.mesh.position.x);
                    const distZ = Math.abs(foxGroup.position.z - col.mesh.position.z);
                    const distY = Math.abs(foxGroup.position.y + 0.5 - col.mesh.position.y);

                    if (distZ < 1.5 && distX < 1.5 && distY < 2.0) {
                        // Eingesammelt!
                        score += 50;
                        updateScoreDisplay();
                        scene.remove(col.mesh);
                        collectibles.splice(i, 1);
                    } else if (col.mesh.position.z > 10) {
                        scene.remove(col.mesh);
                        collectibles.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Difficulty ---
        function setDifficulty(diff) {
            if (!DIFFICULTY_SETTINGS[diff]) return;
            musicDifficulty = diff;
            localStorage.setItem('crashfuchs_difficulty', diff);
            document.querySelectorAll('.diff-btn').forEach(btn => {
                const active = btn.dataset.diff === diff;
                btn.className = 'diff-btn flex-1 py-2 rounded-lg font-bold text-sm transition border-2 ' +
                    (active ? 'bg-orange-500 border-yellow-300 text-white' : 'bg-gray-700 border-gray-500 text-gray-300');
            });
        }

        // --- Highscores ---
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function modeLabel(mode) {
            const labels = {
                'normal':       '🎮',
                'music-easy':   '🎵🐢',
                'music-normal': '🎵🦊',
                'music-hard':   '🎵🔥'
            };
            return labels[mode] || '🎮';
        }

        function saveHighscore(name, currentScore) {
            const entry = {
                name,
                score: Math.floor(currentScore),
                mode: lastGameWasMusic ? ('music-' + musicDifficulty) : 'normal',
                date: new Date().toISOString()
            };
            // Update localStorage (offline copy)
            const local = JSON.parse(localStorage.getItem('crashfuchs_highscores') || '[]');
            local.push(entry);
            local.sort((a, b) => b.score - a.score);
            local.splice(100); // keep top 100 locally
            localStorage.setItem('crashfuchs_highscores', JSON.stringify(local));

            // Persist to server (best-effort)
            fetch('/api/highscores', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: entry.name, score: entry.score, mode: entry.mode })
            }).catch(() => {}); // server may not be running (static file mode)
        }

        function loadHighscores() {
            fetch('/api/highscores?limit=10')
                .then(r => { if (!r.ok) throw new Error('no server'); return r.json(); })
                .then(scores => displayHighscores(scores))
                .catch(() => {
                    // Fallback to localStorage
                    const local = JSON.parse(localStorage.getItem('crashfuchs_highscores') || '[]');
                    displayHighscores(local.slice(0, 10));
                });
        }

        function displayHighscores(scores) {
            const list = document.getElementById('highscore-list');
            const entries = document.getElementById('highscore-entries');
            if (!scores || !scores.length) {
                list.classList.add('hidden');
                return;
            }
            list.classList.remove('hidden');
            entries.innerHTML = scores.map((s, i) =>
                `<div class="flex justify-between items-center py-1 border-b border-gray-600">
                    <span class="flex items-center gap-1"><span class="text-gray-400 w-5 text-right">${i + 1}.</span>
                    <span class="ml-1">${escapeHtml(s.name)}</span></span>
                    <span class="flex items-center gap-1 text-yellow-400 font-bold">
                        ${escapeHtml(String(s.score))}
                        <span class="text-xs text-gray-400">${modeLabel(s.mode)}</span>
                    </span>
                </div>`
            ).join('');
        }

        // --- Audio persistence (IndexedDB for uploaded files) ---
        const IDB_NAME = 'CrashFuchsDB';
        const IDB_VERSION = 1;
        const IDB_STORE = 'audio';

        function openIDB(callback) {
            const req = indexedDB.open(IDB_NAME, IDB_VERSION);
            req.onupgradeneeded = e => e.target.result.createObjectStore(IDB_STORE, { keyPath: 'id' });
            req.onsuccess = e => callback(null, e.target.result);
            req.onerror = e => callback(e.target.error, null);
        }

        function saveAudioToIDB(arrayBuffer, filename) {
            openIDB((err, db) => {
                if (err) return;
                const tx = db.transaction(IDB_STORE, 'readwrite');
                tx.objectStore(IDB_STORE).put({ id: 'lastFile', data: arrayBuffer, name: filename });
            });
        }

        function clearAudioFromIDB() {
            openIDB((err, db) => {
                if (err) return;
                const tx = db.transaction(IDB_STORE, 'readwrite');
                tx.objectStore(IDB_STORE).delete('lastFile');
            });
        }

        function restoreLastAudio() {
            // Priority 1: saved URL
            const savedUrl = localStorage.getItem('crashfuchs_lastAudioUrl');
            if (savedUrl) {
                document.getElementById('audio-url').value = savedUrl;
                setupAudioContext();
                // Load silently (user clicks Play to start)
                fetch(savedUrl)
                    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
                    .then(buf => audioContext.decodeAudioData(buf, buffer => {
                        audioBuffer = buffer;
                        document.getElementById('play-music-btn').disabled = false;
                    }))
                    .catch(() => {
                        // URL no longer valid – clear and try IDB
                        localStorage.removeItem('crashfuchs_lastAudioUrl');
                        document.getElementById('audio-url').value = '';
                        tryRestoreFromIDB();
                    });
                return;
            }
            // Priority 2: last uploaded file stored in IndexedDB
            tryRestoreFromIDB();
        }

        function tryRestoreFromIDB() {
            openIDB((err, db) => {
                if (err) return;
                const tx = db.transaction(IDB_STORE, 'readonly');
                const req = tx.objectStore(IDB_STORE).get('lastFile');
                req.onsuccess = e => {
                    const record = e.target.result;
                    if (!record || audioBuffer) return; // nothing stored, or already loaded
                    setupAudioContext();
                    audioContext.decodeAudioData(record.data.slice(0), buffer => {
                        audioBuffer = buffer;
                        document.getElementById('play-music-btn').disabled = false;
                        const hint = document.getElementById('last-file-hint');
                        hint.textContent = '↩ Letztes File: ' + record.name;
                        hint.classList.remove('hidden');
                    });
                };
            });
        }

        // --- Start ---
        window.onload = init;
    </script>
</body>
</html>
