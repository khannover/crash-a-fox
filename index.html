<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crash Fox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #2D4A1E; touch-action: none; }
        #game-canvas { display: block; width: 100vw; height: 100vh; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .interactive { pointer-events: auto; }
    </style>
</head>
<body>

    <!-- Spiel-Canvas -->
    <div id="game-container"></div>

    <!-- UI Overlay -->
    <div id="ui" class="ui-layer flex flex-col justify-between p-6">
        <div class="flex justify-between items-start text-white drop-shadow-md font-bold text-2xl md:text-4xl" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">
            <div>Score: <span id="score">0</span></div>
        </div>

        <!-- Music Visualizer HUD -->
        <div id="music-viz" class="hidden fixed top-6 right-6 flex gap-1 items-end h-10"></div>

        <!-- Startbildschirm -->
        <div id="start-screen" class="interactive absolute inset-0 flex flex-col items-center justify-center bg-black/50 backdrop-blur-sm z-10">
            <h1 class="text-5xl md:text-7xl font-extrabold text-yellow-400 mb-4 text-center drop-shadow-lg" style="-webkit-text-stroke: 2px #b45309;">CRASH FUCHS</h1>
            <p class="text-white text-lg md:text-2xl mb-8 text-center px-4 max-w-2xl">
                Controls:<br>
                ⬅️ ➡️ (Arrow keys or A/D) to switch lanes<br>
                ⬆️ (Arrow up, Space or W) to jump<br>
                📱 Mobile: Swipe left / right / up
            </p>
            <button id="start-btn" class="px-8 py-4 bg-orange-500 hover:bg-orange-600 text-white text-2xl font-bold rounded-xl shadow-lg transition transform hover:scale-105 border-4 border-yellow-300">
                Start Game
            </button>
            <button id="music-mode-btn" class="mt-4 px-8 py-4 bg-orange-500 hover:bg-orange-600 text-white text-2xl font-bold rounded-xl shadow-lg transition transform hover:scale-105 border-4 border-yellow-300">
                🎵 Music Mode
            </button>
            <div id="music-panel" class="hidden mt-4 p-4 bg-gray-800/90 rounded-xl text-white w-full max-w-md">
                <!-- Difficulty selector -->
                <div class="mb-4">
                    <label class="block mb-2 font-semibold">Difficulty</label>
                    <div class="flex gap-2">
                        <button class="diff-btn flex-1 py-2 rounded-lg font-bold text-sm transition border-2" data-diff="easy">🐢 Easy</button>
                        <button class="diff-btn flex-1 py-2 rounded-lg font-bold text-sm transition border-2" data-diff="normal">🦊 Normal</button>
                        <button class="diff-btn flex-1 py-2 rounded-lg font-bold text-sm transition border-2" data-diff="hard">🔥 Hard</button>
                    </div>
                </div>
                <label for="audio-file" class="block mb-2 font-semibold">Upload MP3</label>
                <input id="audio-file" type="file" accept="audio/mp3,audio/mpeg,audio/*" class="block w-full mb-1 text-sm text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-orange-500 file:text-white hover:file:bg-orange-600">
                <p id="last-file-hint" class="hidden text-xs text-gray-400 mb-3"></p>
                <label for="audio-url" class="block mb-2 font-semibold">or paste audio URL</label>
                <input id="audio-url" type="text" placeholder="https://..." class="block w-full mb-4 px-3 py-2 rounded-lg bg-gray-700 text-white placeholder-gray-400 text-sm">
                <div id="bancamp-section" class="hidden mb-4 border border-gray-600 rounded-xl p-3 bg-black/20">
                    <div class="flex items-center justify-between gap-3 mb-2">
                        <label for="bancamp-track-select" class="font-semibold">or pick a Bancamp track</label>
                        <button id="reload-bancamp-btn" type="button" class="px-3 py-1 rounded-lg bg-gray-700 hover:bg-gray-600 text-xs font-bold transition">
                            ↻ Reload
                        </button>
                    </div>
                    <input id="bancamp-search" type="text" placeholder="Search track, artist, or album..." class="block w-full px-3 py-2 mb-2 rounded-lg bg-gray-700 text-white placeholder-gray-400 text-sm">
                    <p id="bancamp-status" class="text-xs text-gray-400 mb-2">Checking Bancamp signal feed...</p>
                    <select id="bancamp-track-select" class="block w-full px-3 py-2 rounded-lg bg-gray-700 text-white text-sm disabled:opacity-50" disabled>
                        <option value="">Choose a track…</option>
                    </select>
                </div>
                <button id="play-music-btn" disabled class="w-full px-8 py-3 bg-green-600 hover:bg-green-700 disabled:opacity-50 disabled:cursor-not-allowed text-white text-xl font-bold rounded-xl shadow-lg transition">
                    ▶ Play with Music
                </button>
            </div>
        </div>

        <!-- Game Over Bildschirm -->
        <div id="game-over-screen" class="interactive absolute inset-0 flex flex-col items-center justify-center bg-black/80 z-20 hidden overflow-y-auto py-6">
            <h2 class="text-5xl md:text-7xl font-bold text-red-500 mb-2">OUCH!</h2>
            <p class="text-white text-2xl mb-4">Your score: <span id="final-score" class="text-yellow-400 font-bold">0</span></p>

            <!-- Highscore speichern -->
            <div id="save-score-form" class="flex gap-2 mb-4 w-full max-w-xs">
                <input id="player-name" type="text" maxlength="20" placeholder="Your name…"
                    class="flex-1 px-3 py-2 rounded-lg bg-gray-700 text-white placeholder-gray-400 text-base border border-gray-500 focus:outline-none focus:border-yellow-400">
                <button id="save-score-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition" title="Save score">
                    💾
                </button>
            </div>

            <!-- Highscore-Liste -->
            <div id="highscore-list" class="hidden mb-4 w-full max-w-xs">
                <h3 class="text-center text-yellow-400 font-bold mb-2">🏆 Top Scores</h3>
                <div id="highscore-entries" class="text-white text-sm"></div>
            </div>

            <div class="flex gap-4 mt-2">
                <button id="restart-btn" class="px-6 py-4 bg-yellow-500 hover:bg-yellow-600 text-black text-xl font-bold rounded-xl shadow-lg transition transform hover:scale-105">
                    🔄 Try Again
                </button>
                <button id="main-menu-btn" class="px-6 py-4 bg-gray-600 hover:bg-gray-500 text-white text-xl font-bold rounded-xl shadow-lg transition transform hover:scale-105">
                    🏠 Menu
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- Variablen & Zustand ---
        let scene, camera, renderer;
        let foxGroup, foxBody, foxLegs = [];
        let obstacles = [];
        let collectibles = [];
        let activeRows = new Map();
        let rowSerial = 0;
        let groundSegments = [];
        let trees = [];
        let animationId;
        let ambientLight;
        
        // Spielstatus
        let isPlaying = false;
        let score = 0;
        let speed = 0.3; // Initiale Geschwindigkeit (Kisten kommen auf uns zu)
        let distance = 0;
        
        // Fuchs Bewegung
        const LANE_WIDTH = 3;
        let currentLane = 0; // -1 (links), 0 (mitte), 1 (rechts)
        let isJumping = false;
        let velocityY = 0;
        const GRAVITY = -0.015;
        const JUMP_STRENGTH = 0.35;
        const FLOOR_Y = 0.5; // Y-Position des Fuchses am Boden
        let runTime = 0; // Für die Laufanimation

        // --- Audio / Music Reactive Mode ---
        let audioContext = null;
        let analyser = null;
        let audioSource = null;
        let audioBuffer = null;
        let musicReactiveMode = false;
        let lastGameWasMusic = false;    // tracks whether last game used music mode
        let audioRestoredThisSession = false; // restore saved audio only once per session
        let activeAudioLoadToken = 0;
        let bancampEnabled = false;
        let bancampTracksLoaded = false;
        let bancampTracks = [];
        let bancampFilteredTracks = [];

        // Band energy values updated each frame
        let bassEnergy = 0;   // 20–250 Hz
        let midEnergy = 0;    // 250–2000 Hz
        let trebleEnergy = 0; // 2000–8000 Hz
        let overallAmplitude = 0;
        let beatCooldown = 0;
        let dataArray = null;

        // Difficulty
        let musicDifficulty = 'normal';
        const DIFFICULTY_SETTINGS = {
            'easy':   { bassSpeedMultiplier: 0.0015, maxSpeed: 0.7 },
            'normal': { bassSpeedMultiplier: 0.003,  maxSpeed: 1.2 },
            'hard':   { bassSpeedMultiplier: 0.006,  maxSpeed: 2.0 }
        };

        // Audio tuning constants
        const BASS_BIN_START = 0;
        const BASS_BIN_END = 4;       // bins 0–3 (bass)
        const MID_BIN_START = 4;
        const MID_BIN_END = 16;       // bins 4–15 (mid)
        const TREBLE_BIN_START = 16;
        const TREBLE_BIN_END = 32;    // bins 16–31 (treble)
        const BASS_BEAT_THRESHOLD = 0.75;
        const BEAT_COOLDOWN_FRAMES = 15;
        const BASE_SPEED_INCREMENT = 0.0001;
        const MIN_MUSIC_SPEED = 0.3;
        const BASS_SPEED_MULTIPLIER = 0.008;
        const SHAKE_INTENSITY_X = 0.3;
        const SHAKE_INTENSITY_Y = 0.15;

        const LAST_AUDIO_URL_KEY = 'crashfuchs_lastAudioUrl';

        // --- Initialisierung ---
        function init() {
            const container = document.getElementById('game-container');

            // Szene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x3A6B28); // Waldgrün
            scene.fog = new THREE.Fog(0x2D4A1E, 18, 80);  // dichter Waldnebel

            // Kamera (Hinter dem Fuchs platziert)
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
            camera.position.set(0, 5, 8);
            camera.lookAt(0, 1, -10);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Licht
            ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.camera.top = 20;
            dirLight.shadow.camera.bottom = -20;
            dirLight.shadow.camera.left = -20;
            dirLight.shadow.camera.right = 20;
            scene.add(dirLight);

            // Welt aufbauen
            createGround();
            createTrees();
            createFox();

            // Event Listeners für Resize
            window.addEventListener('resize', onWindowResize);

            // Event Listeners für UI
            document.getElementById('start-btn').addEventListener('click', startGame);
            document.getElementById('restart-btn').addEventListener('click', () => {
                if (lastGameWasMusic && audioBuffer) {
                    setupAudioContext();
                    startGame();
                    startMusic();
                    document.getElementById('music-viz').classList.remove('hidden');
                } else {
                    startGame();
                }
            });
            document.getElementById('main-menu-btn').addEventListener('click', mainMenu);

            // Save highscore button
            document.getElementById('save-score-btn').addEventListener('click', () => {
                const nameInput = document.getElementById('player-name');
                const name = nameInput.value.trim() || 'Anonym';
                localStorage.setItem('crashfuchs_lastPlayerName', name);
                saveHighscore(name, score);
                document.getElementById('save-score-form').classList.add('hidden');
                loadHighscores();
            });

            // Music Mode UI
            document.getElementById('music-mode-btn').addEventListener('click', () => {
                const panel = document.getElementById('music-panel');
                panel.classList.toggle('hidden');
                if (!panel.classList.contains('hidden')) {
                    ensureBancampTracksLoaded();
                }
                if (!panel.classList.contains('hidden') && !audioRestoredThisSession) {
                    audioRestoredThisSession = true;
                    restoreLastAudio();
                }
            });

            // Difficulty buttons
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.addEventListener('click', () => setDifficulty(btn.dataset.diff));
            });
            // Apply saved (or default) difficulty on load
            setDifficulty(localStorage.getItem('crashfuchs_difficulty') || 'normal');

            document.getElementById('audio-file').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    loadAudioFile(file);
                    // Persist file in IndexedDB so it can be restored next session
                    const persistenceReader = new FileReader();
                    persistenceReader.onload = ev => saveAudioToIDB(ev.target.result, file.name);
                    persistenceReader.readAsArrayBuffer(file);
                    // Clear any saved URL so we don't conflict
                    localStorage.removeItem(LAST_AUDIO_URL_KEY);
                    resetBancampSelection();
                }
            });

            document.getElementById('audio-url').addEventListener('change', (e) => {
                const url = e.target.value.trim();
                if (url) {
                    loadAudioURL(url);
                    localStorage.setItem(LAST_AUDIO_URL_KEY, url);
                    // Clear saved file so URL takes precedence next session
                    clearAudioFromIDB();
                    resetBancampSelection();
                }
            });

            document.getElementById('reload-bancamp-btn').addEventListener('click', () => {
                loadBancampTracks();
            });

            document.getElementById('bancamp-search').addEventListener('input', () => {
                applyBancampFilter();
            });

            document.getElementById('bancamp-track-select').addEventListener('change', (e) => {
                const track = bancampFilteredTracks.find(item => item.filename === e.target.value)
                    || bancampTracks.find(item => item.filename === e.target.value);
                if (!track) {
                    return;
                }
                document.getElementById('audio-url').value = '';
                localStorage.removeItem(LAST_AUDIO_URL_KEY);
                clearAudioFromIDB();
                loadBancampTrack(track);
            });

            document.getElementById('play-music-btn').addEventListener('click', () => {
                setupAudioContext();
                startGame();
                startMusic();
                document.getElementById('music-viz').classList.remove('hidden');
            });

            // Create music viz bars
            const vizContainer = document.getElementById('music-viz');
            for (let i = 0; i < 8; i++) {
                const bar = document.createElement('div');
                bar.className = 'viz-bar';
                bar.style.cssText = 'width:6px;background:#FBBF24;border-radius:2px;height:4px;';
                vizContainer.appendChild(bar);
            }

            // Steuerung einrichten
            setupControls();

            fetchAppConfig();

            // Erster Render-Durchlauf (damit man was im Hintergrund sieht)
            renderer.render(scene, camera);
        }

        // --- Welt & Objekte ---
        function createGround() {
            // Moosiger Waldboden
            const forestFloorMat = new THREE.MeshLambertMaterial({ color: 0x2E5E1A });
            const floorGeo = new THREE.PlaneGeometry(80, 300);
            const floor = new THREE.Mesh(floorGeo, forestFloorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.z = -80;
            floor.receiveShadow = true;
            scene.add(floor);

            // Schmaler Erdpfad (Waldweg)
            const pathMat = new THREE.MeshLambertMaterial({ color: 0x5C3A1A });
            const pathGeo = new THREE.PlaneGeometry(9, 300);
            const path = new THREE.Mesh(pathGeo, pathMat);
            path.rotation.x = -Math.PI / 2;
            path.position.set(0, 0.01, -80);
            path.receiveShadow = true;
            scene.add(path);

            // Wegrand links/rechts (helleres Erdband)
            const edgeMat = new THREE.MeshLambertMaterial({ color: 0x7A5230 });
            [-5, 5].forEach(ex => {
                const edgeGeo = new THREE.PlaneGeometry(0.6, 300);
                const edge = new THREE.Mesh(edgeGeo, edgeMat);
                edge.rotation.x = -Math.PI / 2;
                edge.position.set(ex, 0.015, -80);
                scene.add(edge);
            });

            // Scrollende Wurzel-/Blattmarkierungen für Geschwindigkeitsgefühl
            const rootMat = new THREE.MeshBasicMaterial({ color: 0x3D2008 });
            for (let i = 0; i < 12; i++) {
                // kurzes unregelmäßiges Wurzelsegment quer über den Weg
                const rw = 5.5 + Math.random() * 2.5;
                const geo = new THREE.PlaneGeometry(rw, 0.18);
                const mesh = new THREE.Mesh(geo, rootMat);
                mesh.rotation.x = -Math.PI / 2;
                mesh.position.set((Math.random() - 0.5) * 2, 0.02, -i * 8);
                scene.add(mesh);
                groundSegments.push(mesh);
            }
        }

        function createPineTree(x, z) {
            const group = new THREE.Group();
            const trunkMat = new THREE.MeshLambertMaterial({ color: 0x3D1F00 });
            const foliageMat = new THREE.MeshLambertMaterial({ color: 0x1A4A0A });
            const foliageMat2 = new THREE.MeshLambertMaterial({ color: 0x255C0F });

            // Trunk
            const trunkGeo = new THREE.CylinderGeometry(0.18, 0.28, 1.4, 6);
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 0.7;
            group.add(trunk);

            // Three cone tiers (bottom to top, each slightly smaller and raised)
            const tiers = [
                { r: 1.5, h: 2.2, y: 1.8, mat: foliageMat },
                { r: 1.1, h: 1.9, y: 3.1, mat: foliageMat2 },
                { r: 0.7, h: 1.6, y: 4.1, mat: foliageMat },
            ];
            tiers.forEach(t => {
                const geo = new THREE.ConeGeometry(t.r, t.h, 7);
                const mesh = new THREE.Mesh(geo, t.mat);
                mesh.position.y = t.y;
                group.add(mesh);
            });

            group.position.set(x, 0, z);
            group.castShadow = true;
            scene.add(group);
            trees.push(group);
        }

        function createTrees() {
            // Two columns of pines on each side; stagger depth every 14 units
            const TREE_SPACING = 14;
            const TREE_COUNT = 16;
            const offsets = [
                { x: -9,  jitter: 1.2 },
                { x: -14, jitter: 2.0 },
                { x:  9,  jitter: 1.2 },
                { x:  14, jitter: 2.0 },
            ];
            offsets.forEach(col => {
                for (let i = 0; i < TREE_COUNT; i++) {
                    const jx = (Math.random() - 0.5) * col.jitter;
                    const jz = (Math.random() - 0.5) * 4;
                    createPineTree(col.x + jx, -i * TREE_SPACING + jz);
                }
            });
        }

        function createFox() {
            foxGroup = new THREE.Group();
            foxLegs = [];

            const orangeMat = new THREE.MeshLambertMaterial({ color: 0xCC4A00 });
            const creamMat  = new THREE.MeshLambertMaterial({ color: 0xFAEED5 });
            const darkMat   = new THREE.MeshLambertMaterial({ color: 0x1A0800 });
            const pinkMat   = new THREE.MeshLambertMaterial({ color: 0xFFAAA0 });

            // Legs — center at group y=0; bottom reaches world y=0 when foxGroup.y=FLOOR_Y=0.5
            const legXZ = [[-0.32, -0.42], [0.32, -0.42], [-0.32, 0.42], [0.32, 0.42]];
            legXZ.forEach(([lx, lz]) => {
                const legGeo = new THREE.BoxGeometry(0.22, 1.0, 0.22);
                const leg = new THREE.Mesh(legGeo, orangeMat);
                leg.position.set(lx, 0.0, lz);
                leg.castShadow = true;
                foxGroup.add(leg);
                foxLegs.push(leg);
            });

            // Torso
            const torsoGeo = new THREE.BoxGeometry(0.85, 0.7, 1.5);
            foxBody = new THREE.Mesh(torsoGeo, orangeMat);
            foxBody.position.set(0, 0.85, 0);
            foxBody.castShadow = true;
            foxGroup.add(foxBody);

            // Cream belly
            const bellyGeo = new THREE.BoxGeometry(0.55, 0.5, 1.3);
            const belly = new THREE.Mesh(bellyGeo, creamMat);
            belly.position.set(0, 0.82, 0.05);
            foxGroup.add(belly);

            // Neck
            const neckGeo = new THREE.BoxGeometry(0.42, 0.38, 0.42);
            const neck = new THREE.Mesh(neckGeo, orangeMat);
            neck.position.set(0, 1.35, -0.45);
            foxGroup.add(neck);

            // Head
            const headGeo = new THREE.BoxGeometry(0.8, 0.75, 0.85);
            const headMesh = new THREE.Mesh(headGeo, orangeMat);
            headMesh.position.set(0, 1.8, -0.75);
            headMesh.castShadow = true;
            foxGroup.add(headMesh);

            // Snout (cream, forward-pointing)
            const snoutGeo = new THREE.BoxGeometry(0.45, 0.3, 0.52);
            const snout = new THREE.Mesh(snoutGeo, creamMat);
            snout.position.set(0, 1.65, -1.22);
            foxGroup.add(snout);

            // Nose
            const noseGeo = new THREE.SphereGeometry(0.09, 8, 8);
            const nose = new THREE.Mesh(noseGeo, darkMat);
            nose.position.set(0, 1.72, -1.47);
            foxGroup.add(nose);

            // Eyes
            const eyeGeo = new THREE.SphereGeometry(0.07, 8, 8);
            [-0.25, 0.25].forEach(ex => {
                const eye = new THREE.Mesh(eyeGeo, darkMat);
                eye.position.set(ex, 1.92, -1.12);
                foxGroup.add(eye);
            });

            // Ears (tall, pointy with pink inner)
            const earOuterGeo = new THREE.ConeGeometry(0.18, 0.55, 4);
            const earInnerGeo = new THREE.ConeGeometry(0.09, 0.30, 4);
            [-0.28, 0.28].forEach(ex => {
                const earO = new THREE.Mesh(earOuterGeo, orangeMat);
                earO.position.set(ex, 2.38, -0.62);
                foxGroup.add(earO);
                const earI = new THREE.Mesh(earInnerGeo, pinkMat);
                earI.position.set(ex, 2.38, -0.62);
                foxGroup.add(earI);
            });

            // Blume auf dem Kopf
            const flowerGroup = new THREE.Group();
            flowerGroup.name = "flower";
            const stemMat2 = new THREE.MeshLambertMaterial({ color: 0x228B22 });
            const stemGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.5, 6);
            const stem = new THREE.Mesh(stemGeo, stemMat2);
            stem.position.y = 0.25;
            flowerGroup.add(stem);
            const centerMat = new THREE.MeshLambertMaterial({ color: 0xFF8C00 });
            const centerGeo = new THREE.SphereGeometry(0.12, 8, 8);
            const flowerCenter = new THREE.Mesh(centerGeo, centerMat);
            flowerCenter.position.y = 0.55;
            flowerGroup.add(flowerCenter);
            const petalMat = new THREE.MeshLambertMaterial({ color: 0xFFEE00 });
            for (let i = 0; i < 6; i++) {
                const petalGeo = new THREE.SphereGeometry(0.10, 6, 6);
                const petal = new THREE.Mesh(petalGeo, petalMat);
                const angle = (i / 6) * Math.PI * 2;
                petal.position.set(Math.cos(angle) * 0.19, 0.55, Math.sin(angle) * 0.19);
                flowerGroup.add(petal);
            }
            flowerGroup.position.set(0, 2.18, -0.75); // top of head
            foxGroup.add(flowerGroup);

            // Tail (bushy, arched upward behind body)
            const tailGroup = new THREE.Group();
            tailGroup.name = "tail";
            const tailDefs = [
                { r1: 0.28, r2: 0.22, h: 0.6, rx: -0.5, y: 0.00, z: 0.00 },
                { r1: 0.22, r2: 0.16, h: 0.6, rx: -1.0, y: 0.32, z: 0.42 },
                { r1: 0.16, r2: 0.10, h: 0.5, rx: -1.5, y: 0.60, z: 0.80 },
            ];
            tailDefs.forEach((d, i) => {
                const geo = new THREE.CylinderGeometry(d.r1, d.r2, d.h, 8);
                const mesh = new THREE.Mesh(geo, i === tailDefs.length - 1 ? creamMat : orangeMat);
                mesh.rotation.x = d.rx;
                mesh.position.set(0, d.y, d.z);
                tailGroup.add(mesh);
            });
            const tipGeo = new THREE.SphereGeometry(0.22, 8, 8);
            const tip = new THREE.Mesh(tipGeo, creamMat);
            tip.position.set(0, 0.82, 1.02);
            tailGroup.add(tip);
            tailGroup.position.set(0, 0.72, 0.75);
            foxGroup.add(tailGroup);

            foxGroup.position.set(0, FLOOR_Y, 0);
            scene.add(foxGroup);
        }

        function createObstacle(zPos, lane, rowId) {
            // Typische "Crash" Holzkiste
            const boxGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            // Einfaches Kreuz-Muster andeuten durch Farbe
            const boxMat = new THREE.MeshLambertMaterial({ color: 0xcd853f }); 
            const box = new THREE.Mesh(boxGeo, boxMat);
            
            box.position.set(lane * LANE_WIDTH, 0.75, zPos);
            box.castShadow = true;
            box.receiveShadow = true;
            
            // Inneres Kreuz (simuliert Kisten-Textur)
            const borderGeo = new THREE.BoxGeometry(1.6, 0.2, 1.6);
            const borderMat = new THREE.MeshLambertMaterial({ color: 0x8b4513 });
            const borderTop = new THREE.Mesh(borderGeo, borderMat);
            const borderBottom = new THREE.Mesh(borderGeo, borderMat);
            borderTop.position.y = 0.65;
            borderBottom.position.y = -0.65;
            box.add(borderTop);
            box.add(borderBottom);
            box.userData.rowId = rowId;

            scene.add(box);
            obstacles.push(box);
        }

        function createCollectible(zPos, lane, rowId) {
            // Wumpa-Frucht ähnlich (Roter Apfel)
            const fruitGeo = new THREE.SphereGeometry(0.5, 16, 16);
            const fruitMat = new THREE.MeshLambertMaterial({ color: 0xff0000 });
            const fruit = new THREE.Mesh(fruitGeo, fruitMat);
            
            fruit.position.set(lane * LANE_WIDTH, 1.5, zPos);
            fruit.castShadow = true;
            
            // Kleines Blatt
            const leafGeo = new THREE.CylinderGeometry(0, 0.2, 0.4);
            const leafMat = new THREE.MeshLambertMaterial({ color: 0x00ff00 });
            const leaf = new THREE.Mesh(leafGeo, leafMat);
            leaf.position.y = 0.5;
            leaf.rotation.z = 0.5;
            fruit.add(leaf);
            fruit.userData.rowId = rowId;

            scene.add(fruit);
            collectibles.push({ mesh: fruit, type: 'apple' });
        }

        function getNextSpawnZ() {
            if (activeRows.size === 0) {
                return -20;
            }
            let farthestZ = Infinity;
            activeRows.forEach(row => {
                farthestZ = Math.min(farthestZ, row.z);
            });
            return farthestZ - 20;
        }

        function clearRowMember(rowId) {
            if (!rowId || !activeRows.has(rowId)) {
                return;
            }
            const row = activeRows.get(rowId);
            row.remaining -= 1;
            if (row.remaining <= 0) {
                activeRows.delete(rowId);
                spawnRandomRow(getNextSpawnZ());
            }
        }

        // --- Steuerung ---
        function setupControls() {
            // Tastatur
            window.addEventListener('keydown', (e) => {
                if (!isPlaying) return;
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                    if (currentLane > -1) currentLane--;
                } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                    if (currentLane < 1) currentLane++;
                } else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.code === 'Space') {
                    jump();
                }
            });

            // Touch / Wischen (Swipe)
            let touchStartX = 0;
            let touchStartY = 0;

            window.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            });

            window.addEventListener('touchend', (e) => {
                if (!isPlaying) return;
                const touchEndX = e.changedTouches[0].screenX;
                const touchEndY = e.changedTouches[0].screenY;
                
                const dx = touchEndX - touchStartX;
                const dy = touchEndY - touchStartY;

                if (Math.abs(dx) > Math.abs(dy)) {
                    // Horizontal Swipe
                    if (Math.abs(dx) > 30) {
                        if (dx > 0 && currentLane < 1) currentLane++; // Swipe Right
                        else if (dx < 0 && currentLane > -1) currentLane--; // Swipe Left
                    }
                } else {
                    // Vertical Swipe
                    if (dy < -30) jump(); // Swipe Up
                }
            });
        }

        function jump() {
            if (!isJumping) {
                isJumping = true;
                velocityY = JUMP_STRENGTH;
            }
        }

        // --- Audio Functions ---
        function setupAudioContext() {
            if (audioContext) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            analyser.connect(audioContext.destination);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
        }

        function setPlayButtonEnabled(enabled) {
            document.getElementById('play-music-btn').disabled = !enabled;
        }

        function beginAudioLoad() {
            activeAudioLoadToken += 1;
            audioBuffer = null;
            setPlayButtonEnabled(false);
            return activeAudioLoadToken;
        }

        function finishAudioLoad(loadToken, buffer) {
            if (loadToken !== activeAudioLoadToken) {
                return false;
            }
            audioBuffer = buffer;
            setPlayButtonEnabled(true);
            return true;
        }

        function decodeAudioFromArrayBuffer(arrayBuffer) {
            setupAudioContext();
            return new Promise((resolve, reject) => {
                audioContext.decodeAudioData(
                    arrayBuffer.slice(0),
                    resolve,
                    reject
                );
            });
        }

        function setBancampStatus(message, isError = false) {
            const statusEl = document.getElementById('bancamp-status');
            statusEl.textContent = message;
            statusEl.className = isError ? 'text-xs text-red-300 mb-2' : 'text-xs text-gray-400 mb-2';
        }

        function resetBancampSelection() {
            const selectEl = document.getElementById('bancamp-track-select');
            if (selectEl) {
                selectEl.value = '';
            }
        }

        function renderBancampTracks() {
            const selectEl = document.getElementById('bancamp-track-select');
            selectEl.innerHTML = '<option value="">Track wählen…</option>';

            bancampFilteredTracks.forEach(track => {
                const option = document.createElement('option');
                const artist = (track.artist || 'Unknown Artist').trim();
                const title = (track.title || track.filename || 'Untitled').trim();
                const album = (track.album || '').trim();
                option.value = track.filename;
                option.textContent = album ? `${artist} - ${title} (${album})` : `${artist} - ${title}`;
                selectEl.appendChild(option);
            });

            selectEl.disabled = bancampFilteredTracks.length === 0;
        }

        function applyBancampFilter() {
            const query = (document.getElementById('bancamp-search').value || '').trim().toLowerCase();
            if (!query) {
                bancampFilteredTracks = bancampTracks.slice();
            } else {
                bancampFilteredTracks = bancampTracks.filter(track => {
                    const haystack = [track.title, track.artist, track.album]
                        .filter(Boolean)
                        .join(' ')
                        .toLowerCase();
                    return haystack.includes(query);
                });
            }

            renderBancampTracks();

            if (!bancampTracks.length) {
                setBancampStatus('No Bancamp tracks available right now.');
                return;
            }

            if (!query) {
                setBancampStatus(`Loaded ${bancampTracks.length} Bancamp track${bancampTracks.length === 1 ? '' : 's'}.`);
                return;
            }

            setBancampStatus(`Found ${bancampFilteredTracks.length} match${bancampFilteredTracks.length === 1 ? '' : 'es'} for "${query}".`);
        }

        async function fetchAppConfig() {
            try {
                const response = await fetch('/api/config', { cache: 'no-store' });
                if (!response.ok) throw new Error('Config request failed');
                const config = await response.json();
                bancampEnabled = Boolean(config && config.bancamp && config.bancamp.enabled);
            } catch (err) {
                bancampEnabled = false;
            }

            const section = document.getElementById('bancamp-section');
            if (bancampEnabled) {
                section.classList.remove('hidden');
                setBancampStatus('Bancamp feed ready. Load a track from the archive.');
            } else {
                section.classList.add('hidden');
            }
        }

        async function ensureBancampTracksLoaded() {
            if (!bancampEnabled || bancampTracksLoaded) {
                return;
            }
            await loadBancampTracks();
        }

        async function loadBancampTracks() {
            if (!bancampEnabled) {
                return;
            }

            const selectEl = document.getElementById('bancamp-track-select');
            selectEl.disabled = true;
            setBancampStatus('Loading Bancamp tracks...');

            try {
                const response = await fetch('/api/bancamp/tracks', { cache: 'no-store' });
                if (!response.ok) throw new Error('Track request failed');
                const payload = await response.json();
                bancampTracks = Array.isArray(payload)
                    ? payload.filter(track => track && track.filename)
                    : [];
                bancampFilteredTracks = bancampTracks.slice();
                bancampTracksLoaded = true;
                applyBancampFilter();
            } catch (err) {
                bancampTracksLoaded = false;
                bancampTracks = [];
                bancampFilteredTracks = [];
                renderBancampTracks();
                setBancampStatus('Bancamp feed unavailable. Check the configured API base URL.', true);
            }
        }

        async function loadBancampTrack(track) {
            if (!track || !track.filename) {
                return;
            }

            const label = `${track.artist || 'Unknown Artist'} - ${track.title || track.filename}`;
            setBancampStatus(`Loading ${label}...`);
            const ok = await loadAudioURL(`/api/bancamp/stream/${encodeURIComponent(track.filename)}`, {
                failureMessage: `Could not load ${label} from Bancamp.`,
                suppressAlert: true
            });
            if (ok) {
                setBancampStatus(`Ready: ${label}`);
            } else {
                setBancampStatus(`Failed to load ${label}.`, true);
            }
        }

        function loadAudioFile(file) {
            setupAudioContext();
            const loadToken = beginAudioLoad();
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const decoded = await decodeAudioFromArrayBuffer(e.target.result);
                    finishAudioLoad(loadToken, decoded);
                } catch (err) {
                    if (loadToken === activeAudioLoadToken) {
                        alert('Could not decode audio file. Please try a different MP3.');
                    }
                }
            };
            reader.readAsArrayBuffer(file);
        }

        async function loadAudioURL(url, options = {}) {
            const failureMessage = options.failureMessage || 'Could not load audio from URL.';
            const suppressAlert = Boolean(options.suppressAlert);
            setupAudioContext();
            const loadToken = beginAudioLoad();

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const buffer = await response.arrayBuffer();
                const decoded = await decodeAudioFromArrayBuffer(buffer);
                return finishAudioLoad(loadToken, decoded);
            } catch (err) {
                if (loadToken !== activeAudioLoadToken) {
                    return false;
                }
                if (!suppressAlert) {
                    if (err.message && err.message.startsWith('HTTP ')) {
                        alert(`${failureMessage} (${err.message})`);
                    } else {
                        alert('Could not decode audio from URL. The file may not be a supported audio format.');
                    }
                }
                return false;
            }
        }

        function startMusic() {
            if (audioSource) {
                try { audioSource.stop(); } catch(e) {}
                audioSource = null;
            }
            if (!audioBuffer) return;
            audioSource = audioContext.createBufferSource();
            audioSource.buffer = audioBuffer;
            audioSource.loop = true;
            audioSource.connect(analyser);
            audioSource.start(0);
            musicReactiveMode = true;
        }

        function updateAudioData() {
            if (!analyser || !dataArray) return;
            analyser.getByteFrequencyData(dataArray);

            // Bass: bins 0–3
            let bass = 0;
            for (let i = BASS_BIN_START; i < BASS_BIN_END; i++) bass += dataArray[i];
            bassEnergy = (bass / (BASS_BIN_END - BASS_BIN_START)) / 255;

            // Mid: bins 4–15
            let mid = 0;
            for (let i = MID_BIN_START; i < MID_BIN_END; i++) mid += dataArray[i];
            midEnergy = (mid / (MID_BIN_END - MID_BIN_START)) / 255;

            // Treble: bins 16–31
            let treble = 0;
            for (let i = TREBLE_BIN_START; i < TREBLE_BIN_END; i++) treble += dataArray[i];
            trebleEnergy = (treble / (TREBLE_BIN_END - TREBLE_BIN_START)) / 255;

            overallAmplitude = (bassEnergy + midEnergy + trebleEnergy) / 3;
        }

        function updateMusicViz() {
            const bars = document.querySelectorAll('#music-viz .viz-bar');
            const step = Math.floor(dataArray.length / 8);
            bars.forEach((bar, i) => {
                const idx = Math.min(i * step, dataArray.length - 1);
                const value = dataArray[idx] / 255;
                bar.style.height = Math.max(4, value * 40) + 'px';
            });
        }

        // --- Game Logic & Loop ---
        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            
            // Stop audio from previous session
            if (audioSource) {
                try { audioSource.stop(); } catch(e) {}
                audioSource = null;
            }
            musicReactiveMode = false;
            document.getElementById('music-viz').classList.add('hidden');

            // Reset state
            score = 0;
            distance = 0;
            speed = 0.3;
            currentLane = 0;
            foxGroup.position.set(0, FLOOR_Y, 0);
            foxGroup.rotation.y = 0;
            isJumping = false;
            velocityY = 0;
            beatCooldown = 0;
            camera.position.set(0, 5, 8);
            updateScoreDisplay();
            
            // Clean up old objects
            obstacles.forEach(o => scene.remove(o));
            collectibles.forEach(c => scene.remove(c.mesh));
            obstacles = [];
            collectibles = [];
            activeRows.clear();
            rowSerial = 0;

            // Generate initial level ahead
            for(let i=1; i<=10; i++) spawnRandomRow(-i * 20);

            isPlaying = true;
            if(!animationId) animate();
        }

        function spawnRandomRow(zPos) {
            const rowType = Math.random();
            const lane = Math.floor(Math.random() * 3) - 1; // -1, 0, or 1
            const rowId = `row-${++rowSerial}`;
            let memberCount = 0;

            if (rowType < 0.6) {
                // Nur Kiste
                createObstacle(zPos, lane, rowId);
                memberCount = 1;
            } else if (rowType < 0.8) {
                // Kiste und Apfel auf einer anderen Spur
                createObstacle(zPos, lane, rowId);
                let appleLane = lane === 0 ? (Math.random() > 0.5 ? 1 : -1) : 0;
                createCollectible(zPos, appleLane, rowId);
                memberCount = 2;
            } else {
                // Nur Apfel (einfacher Punkt)
                createCollectible(zPos, lane, rowId);
                memberCount = 1;
            }

            activeRows.set(rowId, { z: zPos, remaining: memberCount });
        }

        function gameOver() {
            isPlaying = false;
            lastGameWasMusic = musicReactiveMode;
            // Stop music playback
            if (audioSource) {
                try { audioSource.stop(); } catch(e) {}
                audioSource = null;
            }
            musicReactiveMode = false;
            document.getElementById('music-viz').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = Math.floor(score);
            // Pre-fill name from last session
            const savedName = localStorage.getItem('crashfuchs_lastPlayerName') || '';
            document.getElementById('player-name').value = savedName;
            document.getElementById('save-score-form').classList.remove('hidden');
            loadHighscores();
        }

        function mainMenu() {
            isPlaying = false;
            if (audioSource) {
                try { audioSource.stop(); } catch(e) {}
                audioSource = null;
            }
            musicReactiveMode = false;
            document.getElementById('music-viz').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }

        function updateScoreDisplay() {
            document.getElementById('score').innerText = Math.floor(score);
        }

        function animate() {
            animationId = requestAnimationFrame(animate);

            if (isPlaying) {
                // Weltgeschwindigkeit erhöhen
                if (musicReactiveMode) {
                    updateAudioData();
                    const diff = DIFFICULTY_SETTINGS[musicDifficulty];
                    // Base speed progression + bass boost; capped per difficulty
                    speed = Math.min(diff.maxSpeed,
                        Math.max(MIN_MUSIC_SPEED, speed + BASE_SPEED_INCREMENT + bassEnergy * diff.bassSpeedMultiplier));
                } else {
                    speed += BASE_SPEED_INCREMENT;
                }
                distance += speed;
                score += speed * 0.1;
                
                // UI ab und zu updaten
                if(Math.floor(distance) % 5 === 0) updateScoreDisplay();

                // Fuchs Horizontal-Bewegung (Lerp)
                const targetX = currentLane * LANE_WIDTH;
                foxGroup.position.x += (targetX - foxGroup.position.x) * 0.15;

                // Fuchs Rotation beim Spurwechsel (kleiner Neigeeffekt)
                foxGroup.rotation.z = (foxGroup.position.x - targetX) * 0.1;

                // Sprung-Logik (Gravitation)
                if (isJumping) {
                    foxGroup.position.y += velocityY;
                    velocityY += GRAVITY;
                    
                    if (foxGroup.position.y <= FLOOR_Y) {
                        foxGroup.position.y = FLOOR_Y;
                        isJumping = false;
                        velocityY = 0;
                    }
                }

                // Lauf-Animation (Beine wackeln, Körper wippt)
                runTime += speed * 2;
                if(!isJumping) {
                    foxBody.position.y = 0.85 + Math.abs(Math.sin(runTime * 2)) * 0.05;
                    foxLegs[0].rotation.x = Math.sin(runTime * 2) * 0.5;
                    foxLegs[1].rotation.x = -Math.sin(runTime * 2) * 0.5;
                    foxLegs[2].rotation.x = -Math.sin(runTime * 2) * 0.5;
                    foxLegs[3].rotation.x = Math.sin(runTime * 2) * 0.5;
                } else {
                    // Pose während des Sprungs
                    foxLegs.forEach(leg => leg.rotation.x = 0.2);
                }

                // Schwanz wedeln + Blume drehen
                const tail = foxGroup.getObjectByName("tail");
                if (tail) tail.rotation.z = Math.sin(runTime * 4) * 0.25 + (musicReactiveMode ? trebleEnergy * 0.4 : 0);
                const flower = foxGroup.getObjectByName("flower");
                if (flower) flower.rotation.y += 0.04 + (musicReactiveMode ? trebleEnergy * 0.5 : 0);

                // Music reactive effects
                if (musicReactiveMode) {
                    // Background / fog color shift
                    const targetColor = new THREE.Color().setHSL(
                        0.55 - overallAmplitude * 0.35,
                        0.5 + midEnergy * 0.5,
                        0.6 + trebleEnergy * 0.1
                    );
                    scene.background.lerp(targetColor, 0.05);
                    scene.fog.color.lerp(targetColor, 0.05);

                    // Ambient light pulse
                    ambientLight.intensity = 0.6 + bassEnergy * 0.6;

                    // Camera shake on heavy bass beats
                    if (bassEnergy > BASS_BEAT_THRESHOLD && beatCooldown === 0) {
                        camera.position.x += (Math.random() - 0.5) * SHAKE_INTENSITY_X;
                        camera.position.y += (Math.random() - 0.5) * SHAKE_INTENSITY_Y;
                        beatCooldown = BEAT_COOLDOWN_FRAMES;
                    }
                    if (beatCooldown > 0) beatCooldown--;
                    // Gradually return camera to base position to prevent drift
                    camera.position.x += (0 - camera.position.x) * 0.1;
                    camera.position.y += (5 - camera.position.y) * 0.1;

                    // Update visualizer bars
                    updateMusicViz();
                }

                // Bodenstreifen bewegen
                groundSegments.forEach(stripe => {
                    stripe.position.z += speed;
                    if (stripe.position.z > 10) stripe.position.z -= 96;
                });

                // Bäume scrollen
                trees.forEach(tree => {
                    tree.position.z += speed;
                    if (tree.position.z > 12) tree.position.z -= 16 * 14; // wrap over full column depth
                });

                // Hindernisse bewegen & Kollision prüfen
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.position.z += speed;

                    // Kollisionsabfrage (AABB stark vereinfacht)
                    const distX = Math.abs(foxGroup.position.x - obs.position.x);
                    const distZ = Math.abs(foxGroup.position.z - obs.position.z);
                    const distY = obs.position.y - foxGroup.position.y; // Kisten sind ca 1.5 hoch
                    
                    if (distZ < 1.0 && distX < 1.0 && distY > -0.5) {
                        // Crash!
                        gameOver();
                    }

                    // Entfernen und neu spawnen wenn hinter Kamera
                    if (obs.position.z > 10) {
                        const rowId = obs.userData && obs.userData.rowId;
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                        clearRowMember(rowId);
                    }
                }

                // Collectibles bewegen & einsammeln
                for (let i = collectibles.length - 1; i >= 0; i--) {
                    let col = collectibles[i];
                    col.mesh.position.z += speed;
                    col.mesh.rotation.y += 0.05;

                    const distX = Math.abs(foxGroup.position.x - col.mesh.position.x);
                    const distZ = Math.abs(foxGroup.position.z - col.mesh.position.z);
                    const distY = Math.abs(foxGroup.position.y + 0.5 - col.mesh.position.y);

                    if (distZ < 1.5 && distX < 1.5 && distY < 2.0) {
                        // Eingesammelt!
                        score += 50;
                        updateScoreDisplay();
                        const rowId = col.mesh.userData && col.mesh.userData.rowId;
                        scene.remove(col.mesh);
                        collectibles.splice(i, 1);
                        clearRowMember(rowId);
                    } else if (col.mesh.position.z > 10) {
                        const rowId = col.mesh.userData && col.mesh.userData.rowId;
                        scene.remove(col.mesh);
                        collectibles.splice(i, 1);
                        clearRowMember(rowId);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Difficulty ---
        function setDifficulty(diff) {
            if (!DIFFICULTY_SETTINGS[diff]) return;
            musicDifficulty = diff;
            localStorage.setItem('crashfuchs_difficulty', diff);
            document.querySelectorAll('.diff-btn').forEach(btn => {
                const active = btn.dataset.diff === diff;
                btn.className = 'diff-btn flex-1 py-2 rounded-lg font-bold text-sm transition border-2 ' +
                    (active ? 'bg-orange-500 border-yellow-300 text-white' : 'bg-gray-700 border-gray-500 text-gray-300');
            });
        }

        // --- Highscores ---
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function modeLabel(mode) {
            const labels = {
                'normal':       '🎮',
                'music-easy':   '🎵🐢',
                'music-normal': '🎵🦊',
                'music-hard':   '🎵🔥'
            };
            return labels[mode] || '🎮';
        }

        function saveHighscore(name, currentScore) {
            const entry = {
                name,
                score: Math.floor(currentScore),
                mode: lastGameWasMusic ? ('music-' + musicDifficulty) : 'normal',
                date: new Date().toISOString()
            };
            // Update localStorage (offline copy)
            const local = JSON.parse(localStorage.getItem('crashfuchs_highscores') || '[]');
            local.push(entry);
            local.sort((a, b) => b.score - a.score);
            local.splice(100); // keep top 100 locally
            localStorage.setItem('crashfuchs_highscores', JSON.stringify(local));

            // Persist to server (best-effort; works when served via Node.js backend)
            fetch('/api/highscores', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: entry.name, score: entry.score, mode: entry.mode })
            }).catch(err => {
                console.warn('Could not sync score to server (saved locally):', err.message);
            });
        }

        function loadHighscores() {
            fetch('/api/highscores?limit=10')
                .then(r => { if (!r.ok) throw new Error('no server'); return r.json(); })
                .then(scores => displayHighscores(scores))
                .catch(() => {
                    // Fallback to localStorage
                    const local = JSON.parse(localStorage.getItem('crashfuchs_highscores') || '[]');
                    displayHighscores(local.slice(0, 10));
                });
        }

        function displayHighscores(scores) {
            const list = document.getElementById('highscore-list');
            const entries = document.getElementById('highscore-entries');
            if (!scores || !scores.length) {
                list.classList.add('hidden');
                return;
            }
            list.classList.remove('hidden');
            entries.innerHTML = scores.map((s, i) =>
                `<div class="flex justify-between items-center py-1 border-b border-gray-600">
                    <span class="flex items-center gap-1"><span class="text-gray-400 w-5 text-right">${i + 1}.</span>
                    <span class="ml-1">${escapeHtml(s.name)}</span></span>
                    <span class="flex items-center gap-1 text-yellow-400 font-bold">
                        ${escapeHtml(String(s.score))}
                        <span class="text-xs text-gray-400">${modeLabel(s.mode)}</span>
                    </span>
                </div>`
            ).join('');
        }

        // --- Audio persistence (IndexedDB for uploaded files) ---
        const IDB_NAME = 'CrashFuchsDB';
        const IDB_VERSION = 1;
        const IDB_STORE = 'audio';

        function openIDB(callback) {
            const req = indexedDB.open(IDB_NAME, IDB_VERSION);
            req.onupgradeneeded = e => e.target.result.createObjectStore(IDB_STORE, { keyPath: 'id' });
            req.onsuccess = e => callback(null, e.target.result);
            req.onerror = e => callback(e.target.error, null);
        }

        function saveAudioToIDB(arrayBuffer, filename) {
            openIDB((err, db) => {
                if (err) return;
                const tx = db.transaction(IDB_STORE, 'readwrite');
                tx.objectStore(IDB_STORE).put({ id: 'lastFile', data: arrayBuffer, name: filename });
            });
        }

        function clearAudioFromIDB() {
            openIDB((err, db) => {
                if (err) return;
                const tx = db.transaction(IDB_STORE, 'readwrite');
                tx.objectStore(IDB_STORE).delete('lastFile');
            });
        }

        function restoreLastAudio() {
            // Priority 1: saved URL
            const savedUrl = localStorage.getItem(LAST_AUDIO_URL_KEY);
            if (savedUrl) {
                document.getElementById('audio-url').value = savedUrl;
                setupAudioContext();
                // Load silently (user clicks Play to start)
                fetch(savedUrl)
                    .then(r => { if (!r.ok) throw new Error('Failed to load saved audio URL (HTTP ' + r.status + ')'); return r.arrayBuffer(); })
                    .then(buf => audioContext.decodeAudioData(buf, buffer => {
                        audioBuffer = buffer;
                        document.getElementById('play-music-btn').disabled = false;
                    }))
                    .catch(() => {
                        // URL no longer valid – clear and try IDB
                        localStorage.removeItem(LAST_AUDIO_URL_KEY);
                        document.getElementById('audio-url').value = '';
                        tryRestoreFromIDB();
                    });
                return;
            }
            // Priority 2: last uploaded file stored in IndexedDB
            tryRestoreFromIDB();
        }

        function tryRestoreFromIDB() {
            openIDB((err, db) => {
                if (err) return;
                const tx = db.transaction(IDB_STORE, 'readonly');
                const req = tx.objectStore(IDB_STORE).get('lastFile');
                req.onsuccess = e => {
                    const record = e.target.result;
                    if (!record || audioBuffer) return; // nothing stored, or already loaded
                    setupAudioContext();
                    audioContext.decodeAudioData(record.data.slice(0), buffer => {
                        audioBuffer = buffer;
                        document.getElementById('play-music-btn').disabled = false;
                        const hint = document.getElementById('last-file-hint');
                        hint.textContent = '↩ Last file: ' + record.name;
                        hint.classList.remove('hidden');
                    });
                };
            });
        }

        // --- Start ---
        window.onload = init;
    </script>
</body>
</html>
